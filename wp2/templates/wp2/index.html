<!DOCTYPE html>
<html>
<head>
    <title>Dummy WorkProduct Form</title>
</head>
<body>
    <h1>Create WorkProduct</h1>
    <form method="post" action="#">
        <!-- ID field (hidden or readonly) -->
        <p>
            <label for="id_field">ID:</label><br>
            <input type="text" id="id_field" name="id_field" value="1" readonly>
        </p>

        <!-- Name field -->
        <p>
            <label for="name_field">Name:</label><br>
            <input type="text" id="name_field" name="name_field" placeholder="Enter workproduct name">
        </p>

        <!-- First dropdown -->
        <p>
            <label for="dropdown1">Select :</label><br>
            <select id="dropdown1" name="dropdown1">
                <option value="">-- Select  --</option>
                <option value="project1"> 1</option>
                <option value="project2"> 2</option>
            </select>
        </p>

        <!-- Second dropdown -->
        <p>
            <label for="dropdown2">Select Category:</label><br>
            <select id="dropdown2" name="dropdown2">
                <option value="">-- Select Category --</option>
                <option value="type1">Type 1</option>
                <option value="type2">Type 2</option>
            </select>
        </p>

        <!-- Save button -->
        <p>
            <button type="submit">Save</button>
        </p>
    </form>
</body>
</html>
