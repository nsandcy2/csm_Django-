{% extends "base.html" %}
{% block title %}Select Change Request{% endblock %}

{% block content %}
<div class="max-w-md mx-auto p-8 bg-white rounded-2xl shadow-lg text-center" data-aos="fade-up">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Select Change Request Type</h2>

    <div class="space-y-4">
        <form action="{% url 'new_request' %}" method="get">
            <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Create New</button>
        </form>
        <form action="{% url 'existing_change_request' %}" method="get">
            <button type="submit" class="w-full px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">Find Existing</button>
        </form>
    </div>
</div>
{% endblock %}
