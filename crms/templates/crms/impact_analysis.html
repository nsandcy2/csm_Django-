{% extends "base.html" %}
{% block title %}Impact Analysis Phase{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto p-6 bg-white rounded-2xl shadow-lg" data-aos="fade-up">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Impact Analysis Phase</h2>

    {% if messages %}
        <div class="space-y-3 mb-6">
            {% for message in messages %}
                <div class="p-3 rounded-lg text-white"
                     {% if message.tags == 'success' %} style="background-color:#16a34a"
                     {% elif message.tags == 'error' %} style="background-color:#dc2626"
                     {% else %} style="background-color:#4b5563" {% endif %}>
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form id="ImpactAnalysisForm" method="POST" action="{% url 'impact_analysis' %}" class="space-y-6">
        {% csrf_token %}
        <input type="hidden" name="change_request_id" value="{{ impact.change_request.change_request_id }}">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Start Date</label>
                <input type="date" name="start_date" value="{{ impact.start_date|default:'' }}" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Due Date</label>
                <input type="date" name="due_date" value="{{ impact.due_date|default:'' }}" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Responsible Person</label>
                <input type="text" name="responsible_person" value="{{ impact.responsible_person|default:'' }}" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Change Severity</label>
                <select name="change_severity" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
                    <option value="">-- Select Severity --</option>
                    <option value="Major" {% if impact.change_severity == 'Major' %}selected{% endif %}>Major</option>
                    <option value="Minor" {% if impact.change_severity == 'Minor' %}selected{% endif %}>Minor</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Impact on Functional Safety</label>
                <select name="impact_on_functional_safety" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
                    <option value="">-- Select Impact --</option>
                    <option value="Yes" {% if impact.impact_on_functional_safety == 'Yes' %}selected{% endif %}>Yes</option>
                    <option value="No" {% if impact.impact_on_functional_safety == 'No' %}selected{% endif %}>No</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-1">Justification</label>
            <textarea name="justification" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">{{ impact.justification|default:'' }}</textarea>
        </div>

        <div class="flex justify-end gap-4 mt-4">
            <a href="{% url 'new_request_step2' impact.change_request.change_request_id %}" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">Previous</a>
            <input type="submit" name="save_form" value="Save" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
            <input type="submit" name="next_form" value="Next" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            <a href="{% url 'auto_checklist' %}?change_request_id={{ impact.change_request.change_request_id }}" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">Checklist</a>
        </div>
    </form>
</div>
{% endblock %}
