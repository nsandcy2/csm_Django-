{% extends "base.html" %}
{% block title %}Change Request Details{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto p-6 bg-white rounded-2xl shadow-lg" data-aos="fade-up">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Change Request Details</h2>

    <form id="changeRequestForm" method="POST" action="{% url 'new_request' %}" class="space-y-6">
        {% csrf_token %}
        <input type="hidden" name="action" id="formAction" value="Save">
        <input type="hidden" name="change_request_id" value="{{ saved_data.change_request_id }}">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Change Request ID <span class="text-red-500">*</span></label>
                <input type="text" name="value1" value="{{ saved_data.change_request_id }}" required
                       class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Start Date <span class="text-red-500">*</span></label>
                <input type="date" name="value2" id="start_date" value="{{ saved_data.start_date }}" required
                       class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">End Date <span class="text-red-500">*</span></label>
                <input type="date" name="value4" id="end_date" value="{{ saved_data.end_date }}" required
                       class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
            </div>
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-1">Phase <span class="text-red-500">*</span></label>
            <select name="value3" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
                <option value="">-- Select Phase --</option>
                <option value="Change Request Description Phase" {% if saved_data.phase == "Change Request Description Phase" %}selected{% endif %}>Change Request Description Phase</option>
                <option value="Impact Analysis Phase" {% if saved_data.phase == "Impact Analysis Phase" %}selected{% endif %}>Impact Analysis Phase</option>
                <option value="Dependent Work Product Analysis Phase" {% if saved_data.phase == "Dependent Work Product Analysis Phase" %}selected{% endif %}>Dependent Work Product Analysis Phase</option>
                <option value="Verification Phase" {% if saved_data.phase == "Verification Phase" %}selected{% endif %}>Verification Phase</option>
                <option value="Closure" {% if saved_data.phase == "Closure" %}selected{% endif %}>Closure</option>
            </select>
        </div>

        <div>
            <label class="block font-semibold text-gray-700 mb-1">Summary of Change</label>
            <textarea name="value5" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">{{ saved_data.summary_of_change }}</textarea>
        </div>

        <div class="flex justify-end gap-4 mt-4">
            <input type="submit" value="Save" onclick="submitForm('Save')"
                   class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 cursor-pointer">
            <input type="button" value="Next" onclick="submitFormWithoutValidation()"
                   class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer">
            <a href="{% url 'auto_checklist' %}?change_request_id={{ saved_data.change_request_id }}"
               class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 inline-block">Checklist</a>
        </div>
    </form>
</div>

<script>
    function submitForm(actionType) {
        document.getElementById('formAction').value = actionType;
        document.getElementById('changeRequestForm').submit();
    }

    function submitFormWithoutValidation() {
        const form = document.getElementById('changeRequestForm');
        const inputs = form.querySelectorAll('input, select, textarea');
        let valid = true;

        for (let input of inputs) {
            const label = input.closest('div')?.querySelector('label')?.textContent || '';
            if (label.includes('Summary of Change')) continue;

            if ((input.type !== "submit" && input.type !== "button" && input.type !== "hidden") && !input.value.trim()) {
                input.classList.add('border-red-500');
                valid = false;
            } else {
                input.classList.remove('border-red-500');
            }
        }

        if (valid) {
            document.getElementById('formAction').value = 'Next';
            form.submit();
        } else {
            alert("Please fill in all required fields before proceeding to the next step.");
        }
    }

    window.addEventListener('DOMContentLoaded', function () {
        const startDateInput = document.getElementById('start_date');
        const endDateInput = document.getElementById('end_date');

        function updateEndDateState() {
            const startDate = startDateInput?.value;
            if (startDate) {
                endDateInput.disabled = false;
                endDateInput.min = startDate;
                if (endDateInput.value && endDateInput.value < startDate) {
                    endDateInput.value = '';
                }
            } else {
                endDateInput.disabled = true;
                endDateInput.value = '';
                endDateInput.removeAttribute('min');
            }
        }

        if (startDateInput && endDateInput) {
            startDateInput.addEventListener('change', updateEndDateState);
            updateEndDateState();
        }
    });
</script>
{% endblock %}
