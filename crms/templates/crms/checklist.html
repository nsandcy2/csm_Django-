{% extends "base.html" %}
{% block title %}Checklist{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-6 bg-white rounded-2xl shadow-lg" data-aos="fade-up">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Checklist for Change Request {{ cr_id }}</h2>
    <table class="w-full table-auto border-collapse">
        <thead>
            <tr class="bg-blue-600 text-white">
                <th class="p-3 text-left">Check Item</th>
                <th class="p-3 text-left">Status</th>
            </tr>
        </thead>
        <tbody>
            {% for item, status in checks %}
            <tr class="even:bg-gray-100">
                <td class="p-3">{{ item }}</td>
                <td class="p-3 font-bold {% if status == 'Pass' %}text-green-600{% else %}text-red-600{% endif %}">{{ status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
