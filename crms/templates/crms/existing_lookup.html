{% extends "base.html" %}
{% block title %}Lookup Existing Change Request{% endblock %}

{% block content %}
<div class="max-w-md mx-auto p-8 bg-white rounded-2xl shadow-lg" data-aos="fade-up">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Find Existing Change Request</h2>

    {% if messages %}
        {% for message in messages %}
            <p class="{% if message.tags == 'error' %}text-red-600{% else %}text-green-600{% endif %} font-semibold mb-4">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="change_request_id" class="block font-semibold text-gray-700 mb-1">Change Request ID</label>
            <input type="text" name="change_request_id" id="change_request_id" required
                   class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-accent">
        </div>
        <input type="submit" value="Lookup" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer">
    </form>
</div>
{% endblock %}
