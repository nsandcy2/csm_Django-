<!-- templates/core/add_project.html -->
{% extends 'core/base.html' %}
{% block title %}Add Project{% endblock %}
{% block content %}
<h2>Add New Project</h2>
<form method="POST">
    {% csrf_token %}
    <label for="project_name">Project Name (optional):</label>
    <input type="text" name="project_name" id="project_name" placeholder="Enter custom name">
    <button type="submit" class="btn btn-primary mt-2">Add Project</button>
</form>
<br>
<a href="{% url 'dashboard' %}">← Back to Dashboard</a>
{% endblock %}
