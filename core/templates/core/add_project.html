{% extends "base.html" %}
{% block title %}Add Project{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg" data-aos="fade-up">
  <h2 class="text-2xl font-bold text-brand mb-6">Add New Project</h2>

  <form method="POST" class="space-y-5">
    {% csrf_token %}
    <input type="text" name="project_name" id="project_name" placeholder="Enter custom name"
           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none"/>
    <button type="submit"
      class="px-6 py-3 bg-brand text-white rounded-lg hover:bg-accent transition">
      Add Project
    </button>
  </form>

  <a href="{% url 'dashboard' %}" class="inline-block mt-6 text-accent hover:underline">← Back to Dashboard</a>
</div>
{% endblock %}
