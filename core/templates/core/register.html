{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg" data-aos="fade-up">
  <h2 class="text-2xl font-bold text-brand mb-6 text-center">Register</h2>

  <form method="POST" class="space-y-5">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" required
           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none"/>
    <input type="password" name="password" placeholder="Password" required
           class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none"/>

    <select name="role" required
            class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-accent focus:outline-none">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>

    <button type="submit"
      class="w-full py-3 bg-accent text-white font-semibold rounded-lg hover:bg-brand transition">
      Register
    </button>
  </form>

  <p class="text-center text-sm text-gray-600 mt-6">
    Already have an account?
    <a href="{% url 'login' %}" class="text-accent font-medium hover:underline">Login</a>
  </p>
</div>
{% endblock %}
