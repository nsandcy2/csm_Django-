{% extends "base.html" %}
{% block title %}WorkProduct Form{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 mt-12" data-aos="fade-up">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">WorkProduct</h1>

    <form method="post" action="#" class="space-y-4">
        {% csrf_token %}

        <!-- Project ID (readonly) -->
        <div>
            <label for="id_field" class="block text-gray-700 font-semibold mb-1">Project ID:</label>
            <input type="text" id="id_field" name="id_field" value="1" readonly
                class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-brand">
        </div>

        <!-- Name field -->
        <div>
            <label for="name_field" class="block text-gray-700 font-semibold mb-1">Name:</label>
            <input type="text" id="name_field" name="name_field" placeholder="Enter workproduct name"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand">
        </div>

        <!-- First dropdown -->
        <div>
            <label for="dropdown1" class="block text-gray-700 font-semibold mb-1">Select:</label>
            <select id="dropdown1" name="dropdown1"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand">
                <option value="">-- Select --</option>
                <option value="project1">1</option>
                <option value="project2">2</option>
            </select>
        </div>

        <!-- Second dropdown -->
        <div>
            <label for="dropdown2" class="block text-gray-700 font-semibold mb-1">Select Category:</label>
            <select id="dropdown2" name="dropdown2"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand">
                <option value="">-- Select Category --</option>
                <option value="type1">Type 1</option>
                <option value="type2">Type 2</option>
            </select>
        </div>

        <!-- Save button -->
        <div class="text-center">
            <button type="submit"
                class="w-full bg-brand text-white font-semibold px-4 py-2 rounded-lg hover:bg-accent transition">
                Save
            </button>
        </div>
    </form>
</div>
{% endblock %}
